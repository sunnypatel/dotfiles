# aerc accounts.conf — template (copy and fill in real credentials)
# Pattern: imaps://user%40domain.com:PASSWORD@mailhost:993
#          smtps://user%40domain.com:PASSWORD@mailhost:465

# ─── ThinkBuddy ───────────────────────────────────────────────────────────────

[ThinkBuddy-hello]
source   = imaps://hello%40thinkbuddyapp.com:CHANGE_ME@mail.caringlist.com:993
outgoing = smtps://hello%40thinkbuddyapp.com:CHANGE_ME@mail.caringlist.com:465
default  = INBOX
from     = ThinkBuddy <hello@thinkbuddyapp.com>
copy-to  = Sent Items

[ThinkBuddy-privacy]
source   = imaps://privacy%40thinkbuddyapp.com:CHANGE_ME@mail.caringlist.com:993
outgoing = smtps://privacy%40thinkbuddyapp.com:CHANGE_ME@mail.caringlist.com:465
default  = INBOX
from     = ThinkBuddy Privacy <privacy@thinkbuddyapp.com>
copy-to  = Sent Items

